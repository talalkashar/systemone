[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone"
version = "0.1.0"
description = "Fast closed decisions for agents, so the big model only writes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Talal Kashar"}]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/talalkashar/systemone"
Repository = "https://github.com/talalkashar/systemone"
Issues = "https://github.com/talalkashar/systemone/issues"

[project.scripts]
systemone = "systemone.cli:main"
systemone-mcp = "systemone.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
systemone = ["skill/SKILL.md"]
